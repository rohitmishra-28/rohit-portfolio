# Builds the static export and publishes it to GitHub Pages on every push
# to main. By default the site is served at https://<user>.github.io/<repo>/,
# so the build is told its sub-path through NEXT_PUBLIC_BASE_PATH.
#
# Custom domain: set the repository variable CUSTOM_DOMAIN (Settings ›
# Secrets and variables › Actions › Variables), e.g. rohitkumarmishra.com,
# and the same domain under Settings › Pages. The build then serves from the
# root and uses https://<domain> for canonical, share and sitemap URLs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out where the site is served
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io/$REPO_NAME" >> "$GITHUB_ENV"
          fi
      # npm run build first turns any new images in src/assets (CMS uploads)
      # into responsive variants (scripts/optimize-images.mjs).
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_CMS_REPO: ${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
